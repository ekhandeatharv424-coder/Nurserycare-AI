<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | NurseryCare AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">

    <!-- ================= NAVBAR ================= -->

    <nav class="top-nav">

        <a href="index.html" class="brand">
            <span class="brand-icon">🌿</span>
            <span>NurseryCare <strong>AI</strong></span>
        </a>

    </nav>


    <!-- ================= REGISTER ================= -->

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                🌱
            </div>

            <span class="section-badge">
                NURSERYCARE AI
            </span>

            <h1>Create Your Account</h1>

            <p class="auth-subtitle">
                Create your smart nursery workspace and manage
                plant health efficiently.
            </p>


            <!-- ================= FORM ================= -->

            <form id="registerForm" class="auth-form">

                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            👤
                        </span>

                        <input
                            class="input"
                            id="name"
                            type="text"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                        >

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ✉️
                        </span>

                        <input
                            class="input"
                            id="email"
                            type="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input
                            class="input"
                            id="password"
                            type="password"
                            placeholder="Minimum 6 characters"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Show password"
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            🔐
                        </span>

                        <input
                            class="input"
                            id="confirmPassword"
                            type="password"
                            placeholder="Re-enter your password"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >

                    </div>

                </div>


                <!-- TERMS -->

                <label class="terms-row">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        I agree to use NurseryCare AI
                        for plant and nursery management.
                    </span>

                </label>


                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    id="registerBtn"
                    class="btn primary auth-btn"
                >

                    <span id="registerBtnText">
                        Create Account
                    </span>

                </button>

            </form>


            <!-- MESSAGE -->

            <div
                id="msg"
                class="auth-message"
                aria-live="polite"
            ></div>


            <!-- LOGIN -->

            <p class="auth-footer-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <!-- BACK -->

            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Home
            </a>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="site-footer auth-footer">

        <div class="footer-brand">
            🌿 NurseryCare <strong>AI</strong>
        </div>

        <span>
            © 2026 NurseryCare AI
        </span>

    </footer>


    <!-- ================= REGISTER SCRIPT ================= -->

    <script>

        /* =====================================================
           NURSERYCARE AI
           BACKEND REGISTRATION
           ===================================================== */

        const API = "http://localhost:5000/api";


        /* ================= ELEMENTS ================= */

        const registerForm =
            document.getElementById("registerForm");

        const nameInput =
            document.getElementById("name");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const confirmPasswordInput =
            document.getElementById("confirmPassword");

        const togglePassword =
            document.getElementById("togglePassword");

        const msg =
            document.getElementById("msg");

        const registerBtn =
            document.getElementById("registerBtn");

        const registerBtnText =
            document.getElementById("registerBtnText");


        /* ================= SHOW MESSAGE ================= */

        function showMessage(text, type) {

            msg.textContent = text;

            msg.className =
                "auth-message " + type;

        }


        /* ================= PASSWORD TOGGLE ================= */

        togglePassword.addEventListener(
            "click",
            function () {

                if (
                    passwordInput.type === "password"
                ) {

                    passwordInput.type = "text";

                    togglePassword.textContent = "🙈";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Hide password"
                    );

                } else {

                    passwordInput.type = "password";

                    togglePassword.textContent = "👁️";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Show password"
                    );

                }

            }
        );


        /* ================= VALID EMAIL ================= */

        function isValidEmail(email) {

            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

        }


        /* ================= BUTTON LOADING ================= */

        function setLoading(loading) {

            registerBtn.disabled = loading;

            if (loading) {

                registerBtnText.textContent =
                    "Creating Account...";

            } else {

                registerBtnText.textContent =
                    "Create Account";

            }

        }


        /* ================= SAVE SESSION ================= */

        function saveSession(data) {

            if (data.token) {

                localStorage.setItem(
                    "nurserycare_token",
                    data.token
                );

            }

            const user = data.user || {};

            localStorage.setItem(
                "nurserycare_user",
                JSON.stringify(user)
            );

            localStorage.setItem(
                "nurserycare_current_user",
                JSON.stringify(user)
            );

        }


        /* ================= REGISTER ================= */

        registerForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                showMessage("", "");

                const name =
                    nameInput.value.trim();

                const email =
                    emailInput.value.trim().toLowerCase();

                const password =
                    passwordInput.value;

                const confirmPassword =
                    confirmPasswordInput.value;


                /* ================= NAME ================= */

                if (name.length < 2) {

                    showMessage(
                        "Please enter a valid name.",
                        "error"
                    );

                    nameInput.focus();

                    return;

                }


                /* ================= EMAIL ================= */

                if (!isValidEmail(email)) {

                    showMessage(
                        "Please enter a valid email address.",
                        "error"
                    );

                    emailInput.focus();

                    return;

                }


                /* ================= PASSWORD ================= */

                if (password.length < 6) {

                    showMessage(
                        "Password must contain at least 6 characters.",
                        "error"
                    );

                    passwordInput.focus();

                    return;

                }


                /* ================= CONFIRM PASSWORD ================= */

                if (password !== confirmPassword) {

                    showMessage(
                        "Passwords do not match.",
                        "error"
                    );

                    confirmPasswordInput.focus();

                    return;

                }


                /* ================= TERMS ================= */

                const terms =
                    document.getElementById("terms");

                if (!terms.checked) {

                    showMessage(
                        "Please accept the terms to continue.",
                        "error"
                    );

                    return;

                }


                /* ================= START ================= */

                setLoading(true);


                try {

                    /* =========================================
                       SEND REGISTRATION TO NODE.JS BACKEND
                       ========================================= */

                    const response =
                        await fetch(
                            API + "/auth/register",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    name: name,

                                    email: email,

                                    password: password

                                })

                            }
                        );


                    /* ================= RESPONSE ================= */

                    let data = {};

                    try {

                        data =
                            await response.json();

                    } catch (jsonError) {

                        data = {};

                    }


                    /* ================= ERROR ================= */

                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Registration failed. Please try again."
                        );

                    }


                    /* ================= TOKEN CHECK ================= */

                    if (!data.token) {

                        throw new Error(
                            "Account was created, but login session could not be created."
                        );

                    }


                    /* ================= SAVE LOGIN ================= */

                    saveSession(data);


                    /* ================= SUCCESS ================= */

                    showMessage(
                        "Account created successfully. Opening dashboard...",
                        "success"
                    );


                    /* ================= REDIRECT ================= */

                    setTimeout(
                        function () {

                            window.location.href =
                                "dashboard.html";

                        },
                        700
                    );

                }

                catch (error) {

                    console.error(
                        "Registration error:",
                        error
                    );


                    let message =
                        error.message ||
                        "Unable to create account.";


                    /* ================= BACKEND OFFLINE ================= */

                    if (
                        error.name === "TypeError" &&
                        error.message.toLowerCase().includes("fetch")
                    ) {

                        message =
                            "Cannot connect to NurseryCare AI server. Please start the backend on port 5000.";

                    }


                    showMessage(
                        message,
                        "error"
                    );


                    setLoading(false);

                }

            }
        );

    </script>

</body>

</html>
